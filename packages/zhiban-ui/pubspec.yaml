name: zhiban_ui
description: Shared Zhiban Flutter controls and themes.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.9.2 <4.0.0'
  flutter: '>=3.35.6'

dependencies:
  flutter:
    sdk: flutter
  bot_toast: ^4.1.3
  flutter_switch: ^0.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  go_router: 17.2.0

flutter:
  uses-material-design: true
  fonts:
    - family: HarmonyOS Sans SC
      fonts:
        - asset: assets/fonts/harmonyos-sans/HarmonyOS_Sans_SC.ttf
