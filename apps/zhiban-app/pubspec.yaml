---
name: nexwork
description: Zhiban desktop client.
version: 1.2.8+12801
publish_to: none
environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.35.6"
dependencies:
  bot_toast: "^4.1.3"
  crypto: "^3.0.5"
  desktop_drop: "^0.5.0"
  dio: 5.9.0
  file_selector: "^1.0.3"
  flutter:
    sdk: flutter
  flutter_riverpod: "^3.3.1"
  flutter_svg: "^2.2.3"
  go_router: 17.2.0
  package_info_plus: "^9.0.1"
  qr_flutter: "^4.1.0"
  shared_preferences: 2.5.5
  url_launcher: "^6.3.2"
  visibility_detector: "^0.4.0+2"
  xml: "^6.6.1"
  zhiban_client:
    path: "../../packages/zhiban-client"
  zhiban_core:
    path: "../../packages/zhiban-core"
  zhiban_ui:
    path: "../../packages/zhiban-ui"
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: "^5.0.0"
  flutter_launcher_icons: "^0.14.4"
flutter:
  uses-material-design: true
dependency_overrides:
  wukongimfluttersdk:
    path: "../../third_party/wukongimfluttersdk"
flutter_launcher_icons:
  android: false
  ios: false
  image_path: "../../packages/zhiban-client/assets/app_icon_2.png"
  min_sdk_android: 21
  windows:
    generate: true
    icon_size: 256
    image_path: "../../packages/zhiban-client/assets/app_icon.png"
  macos:
    generate: true
    alt_resources: true
    image_path: "../../packages/zhiban-client/assets/app_icon.png"
