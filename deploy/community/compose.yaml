name: zhiban-community
x-app: &app
  build:
    context: ../..
    dockerfile: deploy/community/Dockerfile
  image: zhiban-community:local
  extra_hosts:
    - host.docker.internal:host-gateway
  environment: &env
    AGBUS_POSTGRES_DSN: postgres://community:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/community?sslmode=disable&search_path=agent_bus,public
    COMMUNITY_HTTP: 0.0.0.0:8080
    COMMUNITY_APP_ISSUER: ${COMMUNITY_APP_ISSUER:-}
    AGBUS_SECRETBOX_KEY: ${AGBUS_SECRETBOX_KEY:-}
    OBJECT_PASSWORD: ${OBJECT_PASSWORD:?Set OBJECT_PASSWORD}
    WUKONG_WEBHOOK_SECRET: ${WUKONG_WEBHOOK_SECRET:?Set WUKONG_WEBHOOK_SECRET}
  volumes:
    - ./service.yaml:/etc/community/service.yaml:ro
    - ./.local/jwt.pem:/run/community/jwt.pem:ro
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
    storage-init:
      condition: service_completed_successfully
services:
  wukong:
    image: wukongim/wukongim:v1.2.6
    environment:
      WK_MODE: release
      WK_EXTERNAL_IP: 127.0.0.1
      WK_WEBHOOK_HTTPADDR: http://bus:8080/api/agent-bus/v1/im/wukong/webhook?secret=${WUKONG_WEBHOOK_SECRET:?Set WUKONG_WEBHOOK_SECRET}
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
    ports: [127.0.0.1:18083:5200]
    volumes:
      - wukong:/root/wukongim
  postgres:
    image: pgvector/pgvector:0.8.2-pg16
    environment:
      POSTGRES_DB: community
      POSTGRES_USER: community
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U community -d community]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 30
  migrate:
    <<: *app
    command: [community-migrate]
    depends_on:
      postgres:
        condition: service_healthy
  minio:
    image: zhiban-community-storage:local
    build:
      context: .
      dockerfile: storage.Dockerfile
    command: [minio, server, /data]
    ports: [127.0.0.1:19000:9000]
    environment:
      MINIO_ROOT_USER: community
      MINIO_ROOT_PASSWORD: ${OBJECT_PASSWORD:?Set OBJECT_PASSWORD}
    volumes:
      - objects:/data
  storage-init:
    image: zhiban-community-storage:local
    build:
      context: .
      dockerfile: storage.Dockerfile
    environment:
      OBJECT_PASSWORD: ${OBJECT_PASSWORD:?Set OBJECT_PASSWORD}
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        for attempt in $$(seq 1 30); do
          if mc alias set local http://minio:9000 community "$$OBJECT_PASSWORD" >/dev/null 2>&1; then
            mc mb --ignore-existing local/community
            exit 0
          fi
          sleep 2
        done
        echo 'Object storage unavailable' >&2
        exit 1
    depends_on:
      minio:
        condition: service_started
  bus:
    <<: *app
    ports: [127.0.0.1:18080:8080]
  admin:
    <<: *app
    command: [community-admin, -config, /etc/community/service.yaml]
    ports: [127.0.0.1:18081:8080]
  audit:
    <<: *app
    command: [community-audit-writer, -config, /etc/community/service.yaml]
  worker:
    <<: *app
    command: [community-worker, -config, /etc/community/service.yaml]
  bootstrap:
    <<: *app
    profiles: [bootstrap]
    command: [community-bootstrap]
    stdin_open: true
  admin-web:
    build:
      context: ../..
      dockerfile: deploy/community/admin.Dockerfile
    ports: [127.0.0.1:18082:80]
    depends_on:
      admin:
        condition: service_started
volumes:
  wukong:
  postgres:
  objects:
