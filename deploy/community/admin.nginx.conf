server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    # Multipart avatars and skill packages have their own stricter application limits.
    client_max_body_size 64m;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;
    location /api/admin/ {
        set $admin_origin http://admin:8080;
        proxy_pass $admin_origin;
    }
    # The existing login uses the public identity-provider / OIDC endpoints.
    location /api/agent-bus/v1/auth/ {
        set $public_auth_origin http://bus:8080;
        proxy_pass $public_auth_origin;
    }
    # Revalidate the SPA entry after deployments; asset names already contain hashes.
    location = /index.html { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ /index.html; }
}
