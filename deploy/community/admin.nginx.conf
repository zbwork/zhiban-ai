server {
    listen 80;
    root /usr/share/nginx/html;
    index community.html;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;
    location /api/admin/ {
        set $admin_origin http://admin:8080;
        proxy_pass $admin_origin;
    }
    location / { try_files $uri $uri/ /community.html; }
}
