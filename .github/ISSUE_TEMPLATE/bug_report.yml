name: Bug 反馈
description: 提交可复现的程序错误（安全漏洞请走私密报告）
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 Issue。安全漏洞请阅读 SECURITY.md，不要在此公开利用细节。
        请勿粘贴真实配置、令牌、连接串或用户数据。
  - type: input
    id: version
    attributes:
      label: 版本或公开提交
      description: 填写发布版本或公开仓库 commit。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 平台与运行方式
      description: 操作系统、架构、客户端/容器/源码运行方式。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 最小复现步骤
      description: 从初始状态开始，逐步说明如何触发问题。
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: 预期与实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏后的错误信息
      description: 只提供相关片段，不上传完整环境文件或私有日志。
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前检查
      options:
        - label: 我已移除敏感信息，且这不是应私密报告的安全漏洞。
          required: true
