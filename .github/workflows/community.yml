name: Community materials

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  community-materials:
    name: community-materials
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout public source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Check community materials
        run: python3 .github/scripts/check-community.py .
