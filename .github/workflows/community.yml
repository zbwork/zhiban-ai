name: Community materials

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  community-materials:
    name: community-materials
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check community materials
        run: python3 .github/scripts/check-community.py .

  community-backend-build:
    name: community-backend-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/agent-bus
    env:
      GOWORK: 'off'
    steps:
      - name: Checkout public source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: services/agent-bus/go.mod
          cache-dependency-path: services/agent-bus/go.sum
      - name: Build community entry points
        run: >-
          go build -mod=readonly
          ./cmd/community-bus ./cmd/community-admin ./cmd/community-worker
          ./cmd/community-bootstrap ./cmd/community-migrate ./cmd/community-audit-writer

  community-admin-build:
    name: community-admin-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/agent-bus-admin
    steps:
      - name: Checkout public source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.32.1
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build community admin
        run: pnpm build
      - name: Lint community admin
        run: pnpm lint
