name: Community materials

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  community-materials:
    name: community-materials
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check community materials
        run: python3 .github/scripts/check-community.py .
